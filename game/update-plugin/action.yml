name: Update a game's copy of an Unreal plugin
description: Open a pull request in this repository that replaces its copy of a private plugin with the plugin's latest release.

inputs:
  plugin:
    description: The plugin's repository, owner/name.
    required: true
  token:
    description: Token that can read the plugin repository's releases. Read-only access to its contents is enough.
    required: true
  path:
    description: Where the copy lives in this repository. Defaults to Plugins/<plugin name>.
    default: ''
  engine-version:
    description: Which engine's zip to copy. Defaults to the newest in the release.
    default: ''
  base:
    description: Branch to propose the update to. Defaults to the repository's default branch.
    default: ''
  github-token:
    description: Token that can push branches and open pull requests in this repository.
    default: ${{ github.token }}

outputs:
  url:
    description: The pull request, or empty when there was nothing to propose.
    value: ${{ steps.update.outputs.url }}

runs:
  using: composite
  steps:
    - id: update
      shell: powershell
      env:
        PLUGIN_TOKEN: ${{ inputs.token }}
        GH_TOKEN: ${{ inputs.github-token }}
        PLUGIN: ${{ inputs.plugin }}
        TARGET_PATH: ${{ inputs.path }}
        ENGINE: ${{ inputs.engine-version }}
        BASE: ${{ inputs.base }}
      run: |
        & "$env:GITHUB_ACTION_PATH\Update-PluginCopy.ps1" -Plugin $env:PLUGIN -Path $env:TARGET_PATH -EngineVersion $env:ENGINE -Base $env:BASE
