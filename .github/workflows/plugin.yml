# The whole pipeline for an Unreal Engine code plugin on Fab, built from the plugin/ actions.
# A plugin calls it from a short ci.yml; see README.md.
#
#   commits  GitHub-hosted. Pull requests and pushes: every commit message is a conventional commit.
#   package  GitHub-hosted. Fab checks, then the source zip Fab is given, per engine version. Also
#            checks Content/Docs against the docs site's rules.
#   build    Build machine. BuildPlugin on that zip, then the automation tests on the result.
#   release  Once every engine passed, for a run with release set (the next version comes from the
#            commit messages) or a pushed vX.Y.Z tag: GitHub release and tag, release branch, Fab
#            checklist. With publish-docs, the docs bundle is zipped onto the release.
#   docs     With publish-docs, after the release: pushes that bundle to docs.khaos.systems.
#   badges   On the default branch of a public repository: tests, engines and lines of code.
#   notify   Optional Discord message for releases and failures.
#
# A pull request from an outside contributor runs none of this until a maintainer has read it and
# approved the run: the organization requires approval for all outside contributors.
name: Unreal plugin

on:
  workflow_call:
    inputs:
      engine-versions:
        description: JSON array of engine versions to build, test and package for, e.g. '["5.7", "5.8"]'.
        type: string
        default: '["5.8"]'
      run-tests:
        description: Run the plugin's automation tests in a headless editor.
        type: boolean
        default: true
      test-filter:
        description: Automation test filter. Defaults to the plugin name.
        type: string
        default: ''
      strict-includes:
        description: Also compile without unity builds or shared precompiled headers.
        type: boolean
        default: true
      build-runner:
        description: JSON array of labels for the build machine, which has the engines installed from the Epic Games Launcher.
        type: string
        default: '["self-hosted", "Windows", "unreal"]'
      release:
        description: Release the next version, worked out from the commit messages since the last release. Default branch only.
        type: boolean
        default: false
      publish-docs:
        description: Publish Content/Docs to docs.khaos.systems with each release, and fail any run whose docs break the site's rules. Needs docs-token.
        type: boolean
        default: false
      vendor-to:
        description: Deprecated and ignored. Games now pull private plugin releases themselves with game/update-plugin.
        type: string
        default: '[]'
    secrets:
      discord-webhook-url:
        description: Discord webhook for release and failure notices. Optional.
        required: false
      docs-token:
        description: The organization secret KHAOS_DOCS_TOKEN, which can push to KhaosSystems/docs-content. Needed with publish-docs.
        required: false
      vendor-token:
        description: Deprecated and ignored, with vendor-to.
        required: false

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0

      - uses: KhaosSystems/unreal-actions/commits/check@v1
        with:
          repo-dir: plugin
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}

  package:
    name: Validate and package
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      plugin: ${{ steps.package.outputs.plugin }}
      version: ${{ steps.package.outputs.version }}
      release: ${{ steps.kind.outputs.release }}
      tag: ${{ steps.kind.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0 # the next version is worked out from the commits since the last tag

      - id: next
        if: inputs.release
        uses: KhaosSystems/unreal-actions/commits/next-version@v1
        with:
          repo-dir: plugin
          fail-if-none: 'true'

      # A release either comes from the release input, with the version worked out above, or from
      # a pushed vX.Y.Z tag. Its version is stamped into the zips and they are published.
      - id: kind
        shell: powershell
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $Tag = ''
          if ($env:RELEASE_INPUT -eq 'true')
          {
            if ($env:REF_NAME -ne $env:DEFAULT_BRANCH) { throw "Release from $env:DEFAULT_BRANCH, not $env:REF_NAME." }
            $Tag = $env:NEXT_TAG
          }
          elseif ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -match '^v\d')
          {
            $Tag = $env:REF_NAME
          }
          $Release = [bool]$Tag
          "release=$($Release.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
          "tag=$Tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii

      - name: Deprecated inputs
        if: inputs.vendor-to != '[]'
        shell: powershell
        run: Write-Host '::warning title=vendor-to is deprecated::Plugin releases no longer push to games. Remove vendor-to and vendor-token from ci.yml; games pull releases with KhaosSystems/unreal-actions/game/update-plugin.'

      # Here rather than in the release job, so a release without the token fails before the build.
      # Only whether it is set reaches this step, not the token. Pull requests from forks and
      # Dependabot get no secrets, so they are not warned.
      - name: Docs token
        if: inputs.publish-docs && !github.event.pull_request.head.repo.fork && github.actor != 'dependabot[bot]'
        shell: powershell
        env:
          HAS_TOKEN: ${{ secrets.docs-token != '' }}
          RELEASE: ${{ steps.kind.outputs.release }}
        run: |
          if ($env:HAS_TOKEN -eq 'true') { exit 0 }
          $Message = 'docs-token is empty. Pass KHAOS_DOCS_TOKEN as docs-token in ci.yml, and check that the organization secret exists and this repository can use it.'
          if ($env:RELEASE -eq 'true') { Write-Host "::error title=No docs token::$Message"; exit 1 }
          Write-Host "::warning title=No docs token::$Message Releases fail without it."

      # A release also checks that the token still works: it may have expired.
      - name: Check docs token
        if: inputs.publish-docs && steps.kind.outputs.release == 'true'
        uses: KhaosSystems/unreal-actions/plugin/publish-docs@v1
        with:
          check-token: 'true'
          token: ${{ secrets.docs-token }}

      - id: package
        uses: KhaosSystems/unreal-actions/plugin/package@v1
        with:
          plugin-dir: plugin
          engine-versions: ${{ inputs.engine-versions }}
          version: ${{ steps.kind.outputs.tag }}

      # Every run, so problems show long before a release: errors with publish-docs, else warnings.
      # Without publish-docs it never fails the run, whatever goes wrong.
      - name: Check docs
        continue-on-error: ${{ !inputs.publish-docs }}
        uses: KhaosSystems/unreal-actions/plugin/docs@v1
        with:
          plugin-dir: plugin
          engine-versions: ${{ inputs.engine-versions }}
          strict: ${{ inputs.publish-docs }}
          private: ${{ github.event.repository.private }}

      - uses: actions/upload-artifact@v7
        with:
          name: source-packages
          path: dist/
          if-no-files-found: error

  build:
    name: Build and test (UE ${{ matrix.engine }})
    needs: package
    runs-on: ${{ fromJSON(inputs.build-runner) }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Concurrent BuildPlugin runs on one machine share UnrealBuildTool state and fail spuriously.
      max-parallel: 1
      matrix:
        engine: ${{ fromJSON(inputs.engine-versions) }}
    steps:
      # The workspace survives between jobs on a self-hosted runner.
      - name: Clear previous packages
        shell: powershell
        run: if (Test-Path dist) { Remove-Item dist -Recurse -Force }

      - uses: actions/download-artifact@v8
        with:
          name: source-packages
          path: dist

      # Builds the zip, not a checkout, so what passes is exactly what Fab receives.
      - id: build
        uses: KhaosSystems/unreal-actions/plugin/build@v1
        with:
          package: dist\${{ needs.package.outputs.plugin }}-${{ needs.package.outputs.version }}-UE${{ matrix.engine }}.zip
          engine-version: ${{ matrix.engine }}
          strict-includes: ${{ inputs.strict-includes }}

      - id: test
        if: inputs.run-tests
        uses: KhaosSystems/unreal-actions/plugin/test@v1
        with:
          plugin-dir: ${{ steps.build.outputs.plugin-dir }}
          engine-version: ${{ matrix.engine }}
          filter: ${{ inputs.test-filter }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-UE${{ matrix.engine }}
          path: |
            ${{ runner.temp }}\b\logs
            ${{ runner.temp }}\t\logs
            ${{ runner.temp }}\t\report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results
        if: always() && inputs.run-tests
        uses: actions/upload-artifact@v7
        with:
          name: test-results-UE${{ matrix.engine }}
          path: ${{ runner.temp }}\t\test-results.json
          if-no-files-found: ignore
          retention-days: 14

      # Prebuilt for Win64, for anyone on the team who wants the plugin without compiling it.
      - name: Upload built plugin
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.package.outputs.plugin }}-UE${{ matrix.engine }}-Win64
          path: ${{ steps.build.outputs.plugin-dir }}
          retention-days: 14

  release:
    name: Publish release
    needs: [package, build]
    if: needs.package.outputs.release == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      url: ${{ steps.release.outputs.url }}
      docs-folder: ${{ steps.docs.outputs.folder }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
          fetch-depth: 0 # release notes are the commits since the previous tag

      - uses: actions/download-artifact@v8
        with:
          name: source-packages
          path: dist

      # Built from the commit being released and checked before anything is published, so a docs
      # problem stops the release instead of leaving it half done.
      - id: docs
        if: inputs.publish-docs
        uses: KhaosSystems/unreal-actions/plugin/docs@v1
        with:
          plugin-dir: plugin
          engine-versions: ${{ inputs.engine-versions }}
          tag: ${{ needs.package.outputs.tag }}
          strict: 'true'
          private: ${{ github.event.repository.private }}
          out-dir: docs-dist

      # For the docs job: the bundle that goes on the release, so a re-run pushes the same bytes.
      - name: Upload docs
        if: inputs.publish-docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-bundle
          path: docs-dist/
          if-no-files-found: error
          overwrite: true

      - id: release
        uses: KhaosSystems/unreal-actions/plugin/release@v1
        with:
          plugin-dir: plugin
          packages-dir: dist
          tag: ${{ needs.package.outputs.tag }}
          target: ${{ github.sha }}
          docs-zip: ${{ steps.docs.outputs.zip }}

  # Its own job, so a failed push leaves the release alone: re-run the failed jobs, and only this one
  # runs again, pushing the bundle the release holds. It replaces only this version's folder.
  docs:
    name: Publish docs
    needs: release
    if: inputs.publish-docs
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-bundle
          path: docs-dist

      - uses: KhaosSystems/unreal-actions/plugin/publish-docs@v1
        with:
          bundle-dir: docs-dist/${{ needs.release.outputs.docs-folder }}
          token: ${{ secrets.docs-token }}

  badges:
    name: Badges
    needs: [package, build]
    # Also after a failed build, so the badges show it. shields.io can only read public repositories.
    if: >-
      always() && needs.package.result == 'success' && github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch && !github.event.repository.private
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin

      - uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          path: results

      - uses: KhaosSystems/unreal-actions/plugin/badges@v1
        with:
          plugin-dir: plugin
          engine-versions: ${{ inputs.engine-versions }}
          results-dir: results

  notify:
    name: Notify
    needs: [package, build, release, docs]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send Discord message
        env:
          WEBHOOK: ${{ secrets.discord-webhook-url }}
          PLUGIN: ${{ needs.package.outputs.plugin }}
          VERSION: ${{ needs.package.outputs.version }}
          RESULTS: ${{ needs.package.result }} ${{ needs.build.result }} ${{ needs.release.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RELEASE_URL: ${{ needs.release.outputs.url }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          if [ "$RELEASE_RESULT" = success ]; then
            title="${PLUGIN} ${VERSION} is ready for Fab"
            description="Built and tested. Release: ${RELEASE_URL}
          The run summary has the links and version notes to paste into the Fab portal: ${RUN_URL}"
            if [ "$DOCS_RESULT" = failure ]; then
              description="${description}
          Publishing the docs failed. Re-run the failed jobs; that leaves the release alone."
            fi
            color=3066993
          elif [[ " $RESULTS " == *" failure "* ]]; then
            title="${PLUGIN:-$REPOSITORY} CI failed on ${REF}"
            description="${RUN_URL}"
            color=15158332
          else
            exit 0
          fi
          jq -n --arg title "$title" --arg description "$description" --argjson color "$color" \
            '{username: "GitHub Actions", embeds: [{title: $title, description: $description, color: $color}]}' |
            curl --fail --silent --show-error -H 'Content-Type: application/json' -d @- "$WEBHOOK"
