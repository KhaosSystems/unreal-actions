name: Next version
description: Work out the next semver version from the conventional commits since the last vX.Y.Z tag.

inputs:
  repo-dir:
    description: The repository, checked out with its history and tags (fetch-depth 0).
    default: .
  ref:
    description: The commit to release.
    default: HEAD
  fail-if-none:
    description: Fail when there is nothing to release, instead of returning an empty version.
    default: 'false'

outputs:
  version:
    description: The next version, such as 1.3.0. Empty when there is nothing to release.
    value: ${{ steps.next.outputs.version }}
  tag:
    description: The next version as a tag, such as v1.3.0.
    value: ${{ steps.next.outputs.tag }}
  bump:
    description: major, minor, patch or none.
    value: ${{ steps.next.outputs.bump }}
  previous:
    description: The last release tag, if any.
    value: ${{ steps.next.outputs.previous }}

runs:
  using: composite
  steps:
    - id: next
      shell: powershell
      env:
        REPO_DIR: ${{ inputs.repo-dir }}
        REF: ${{ inputs.ref }}
        FAIL_IF_NONE: ${{ inputs.fail-if-none }}
      run: |
        & "$env:GITHUB_ACTION_PATH\Get-NextVersion.ps1" -RepoDir $env:REPO_DIR -Ref $env:REF -FailIfNone:($env:FAIL_IF_NONE -eq 'true')
