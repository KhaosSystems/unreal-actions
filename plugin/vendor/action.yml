name: Vendor Unreal plugin release
description: Open a pull request in a repository that keeps its own copy of the plugin, replacing the copy with a release's source package.

inputs:
  packages-dir:
    description: Folder with the zips from the package action.
    default: dist
  repository:
    description: The repository that keeps a copy of the plugin, owner/name.
    required: true
  token:
    description: Token that can push branches and open pull requests in that repository.
    required: true
  tag:
    description: The release tag, for the link and notes in the pull request.
    default: ${{ github.ref_name }}
  path:
    description: Where the copy lives in that repository. Defaults to Plugins/<plugin name>.
    default: ''
  engine-version:
    description: Which engine's zip to copy. Defaults to the newest.
    default: ''
  base:
    description: Branch to propose the update to. Defaults to the repository's default branch.
    default: ''
  github-token:
    description: Token that can read this repository's releases.
    default: ${{ github.token }}

outputs:
  url:
    description: The pull request, or empty when the copy was already up to date.
    value: ${{ steps.vendor.outputs.url }}

runs:
  using: composite
  steps:
    - id: vendor
      shell: powershell
      env:
        GH_TOKEN: ${{ inputs.token }}
        SOURCE_TOKEN: ${{ inputs.github-token }}
        PACKAGES_DIR: ${{ inputs.packages-dir }}
        REPOSITORY: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
        TARGET_PATH: ${{ inputs.path }}
        ENGINE: ${{ inputs.engine-version }}
        BASE: ${{ inputs.base }}
      run: |
        & "$env:GITHUB_ACTION_PATH\Update-VendoredPlugin.ps1" -PackageDir $env:PACKAGES_DIR -Repository $env:REPOSITORY -Tag $env:TAG -Path $env:TARGET_PATH -EngineVersion $env:ENGINE -Base $env:BASE
